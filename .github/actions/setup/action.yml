name: Setup pnpm, Node.js and Rust web tooling
description: Install Node.js, pnpm, the locked prebuilt wasm-bindgen CLI, and project dependencies

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install pnpm
      shell: bash
      run: |
        set -euxo pipefail
        corepack enable
        corepack prepare pnpm@10.33.4 --activate
        node --version
        npm --version
        pnpm --version
        pnpm store path

    - name: Install verified prebuilt wasm-bindgen CLI
      shell: bash
      run: node build/scripts/install-wasm-bindgen-cli.mjs

    - name: Install dependencies from the committed lockfile
      shell: bash
      run: |
        set -euxo pipefail
        pnpm install --frozen-lockfile --ignore-scripts
        git diff --exit-code -- package.json pnpm-lock.yaml
      env:
        GITHUB_TOKEN: ${{ github.token }}
