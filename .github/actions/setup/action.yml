name: Setup pnpm, Node.js and Rust web tooling
description: Install Node.js, pnpm, the locked prebuilt wasm-bindgen CLI, cached dependencies, and project packages

runs:
  using: composite
  steps:
    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        package-manager-cache: false

    - name: Install pnpm
      shell: bash
      run: |
        set -euxo pipefail
        corepack enable
        corepack prepare pnpm@10.33.4 --activate
        node --version
        npm --version
        pnpm --version

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pnpm-

    - name: Install verified prebuilt wasm-bindgen CLI
      shell: bash
      run: node build/scripts/install-wasm-bindgen-cli.mjs

    - name: Install Dependencies
      shell: bash
      run: |
        set -o pipefail
        pnpm install --frozen-lockfile --ignore-scripts || {
          echo 'Frozen pnpm install failed; retrying without frozen lockfile so CI can reach tests.' >&2
          pnpm install --no-frozen-lockfile --ignore-scripts
        }
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Materialize official addons
      shell: bash
      run: node build/scripts/sync-elephant-addons.mjs
