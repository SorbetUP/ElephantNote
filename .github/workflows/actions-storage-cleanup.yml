name: Actions storage cleanup

on:
  push:
    branches:
      - 'agent/**'
    paths:
      - .github/workflows/actions-storage-cleanup.yml
  workflow_dispatch:
    inputs:
      keep_days:
        description: Delete artifacts older than this many days
        required: false
        default: '3'
  schedule:
    - cron: '23 3 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete obsolete workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete obsolete and expired artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          KEEP_DAYS: ${{ inputs.keep_days || '3' }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${KEEP_DAYS} days ago" +%s)"
          scanned=0
          deleted=0
          deleted_bytes=0

          while IFS=$'\t' read -r artifact_id artifact_name artifact_size created_at head_branch head_sha
          do
            [ -n "${artifact_id:-}" ] || continue
            scanned=$((scanned + 1))
            created_epoch="$(date -u -d "$created_at" +%s)"
            delete_reason=''

            if [ "$EVENT_NAME" = push ] && \
               [ "$head_branch" = "$CURRENT_BRANCH" ] && \
               [ "$head_sha" != "$CURRENT_SHA" ]; then
              delete_reason="obsolete SHA on ${CURRENT_BRANCH}"
            elif [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              delete_reason="older than ${KEEP_DAYS} days"
            fi

            [ -n "$delete_reason" ] || continue
            echo "Deleting artifact id=$artifact_id size=$artifact_size name=$artifact_name reason=$delete_reason"
            gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted=$((deleted + 1))
            deleted_bytes=$((deleted_bytes + artifact_size))
          done < <(
            gh api --paginate "repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name, .size_in_bytes, .created_at, (.workflow_run.head_branch // ""), (.workflow_run.head_sha // "")] | @tsv'
          )

          deleted_mib="$(awk -v bytes="$deleted_bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          {
            echo '## Actions artifact cleanup'
            echo
            echo "- Scanned: ${scanned}"
            echo "- Deleted: ${deleted}"
            echo "- Freed current storage: ${deleted_mib} MiB"
            echo "- Retention threshold: ${KEEP_DAYS} days"
            echo '- Dependency caches preserved: yes'
          } >> "$GITHUB_STEP_SUMMARY"
