name: Actions storage guard

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/actions/setup/action.yml'
      - '.github/workflows/**'
      - build/scripts/run-tauri-build.mjs
      - build/scripts/verify-actions-storage-budget.mjs
      - build/scripts/verify-actions-node24.mjs
      - build/scripts/verify-ci-reproducibility.mjs
      - build/scripts/verify-tauri-build-runtime-boundary.mjs
      - Elephant/backend/tauri/tauri.conf.json
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/actions/setup/action.yml'
      - '.github/workflows/**'
      - build/scripts/run-tauri-build.mjs
      - build/scripts/verify-actions-storage-budget.mjs
      - build/scripts/verify-actions-node24.mjs
      - build/scripts/verify-ci-reproducibility.mjs
      - build/scripts/verify-tauri-build-runtime-boundary.mjs
      - Elephant/backend/tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-budget:
    name: Enforce compact and supported Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify Actions storage budget
        run: node build/scripts/verify-actions-storage-budget.mjs
      - name: Verify Node 24 action runtimes
        run: node build/scripts/verify-actions-node24.mjs
      - name: Verify frozen dependency setup
        run: node build/scripts/verify-ci-reproducibility.mjs
      - name: Verify deterministic Tauri packaging boundary
        run: node build/scripts/verify-tauri-build-runtime-boundary.mjs
