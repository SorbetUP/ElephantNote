name: Actions storage guard

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/**'
      - build/scripts/verify-actions-storage-budget.mjs
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/**'
      - build/scripts/verify-actions-storage-budget.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-budget:
    name: Enforce compact Actions artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Actions storage budget
        run: node build/scripts/verify-actions-storage-budget.mjs
