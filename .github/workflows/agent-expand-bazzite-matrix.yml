name: Apply physical Bazzite matrix hardening

on:
  push:
    branches:
      - agent/addon-runtime-stabilization
    paths:
      - '.github/workflows/agent-expand-bazzite-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/addon-runtime-stabilization
          fetch-depth: 0
      - name: Patch physical actions and independent Excalidraw proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          automation_path = Path('Elephant/frontend/src/renderer/src/platform/automationAcceptancePhysicalSurface.js')
          automation = automation_path.read_text()
          marker = "      api.pasteText = (selector, text) => {"
          pointer = r'''      api.pointerDrag = async (selector, points = []) => {
        const element = requireElement(target, selector)
        const rect = element.getBoundingClientRect()
        if (!(rect.width > 0 && rect.height > 0)) throw new Error(`pointerDrag target has no visible bounds: ${selector}`)
        const path = Array.isArray(points) && points.length >= 2
          ? points
          : [{ x: 0.28, y: 0.36 }, { x: 0.45, y: 0.58 }, { x: 0.72, y: 0.38 }]
        const coordinates = path.map((point) => ({
          clientX: rect.left + (Math.abs(Number(point.x)) <= 1 ? Number(point.x) * rect.width : Number(point.x)),
          clientY: rect.top + (Math.abs(Number(point.y)) <= 1 ? Number(point.y) * rect.height : Number(point.y))
        }))
        const dispatch = (name, point, buttons) => {
          const init = {
            ...point,
            bubbles: true,
            cancelable: true,
            composed: true,
            button: 0,
            buttons,
            pointerId: 1,
            pointerType: 'mouse',
            isPrimary: true,
            pressure: buttons ? 0.5 : 0
          }
          const PointerEventConstructor = target.PointerEvent || target.MouseEvent
          element.dispatchEvent(new PointerEventConstructor(name, init))
        }
        element.focus?.()
        dispatch('pointerdown', coordinates[0], 1)
        for (const point of coordinates.slice(1)) {
          dispatch('pointermove', point, 1)
          await wait(16)
        }
        dispatch('pointerup', coordinates.at(-1), 0)
        await wait(100)
        return api.readDom(selector)
      }

'''
          if 'api.pointerDrag = async' not in automation:
              automation = replace_once(automation, marker, pointer + marker, 'pointerDrag insertion')
          automation_path.write_text(automation)

          harness_path = Path('build/scripts/lib/real-app-harness.mjs')
          harness = harness_path.read_text()
          old_actions = """  'fill',
  'insertText',
  'press',
  'selectText',"""
          new_actions = """  'dropFiles',
  'fill',
  'insertText',
  'pointerDrag',
  'press',
  'pressShortcut',
  'selectText',"""
          if "  'pointerDrag'," not in harness:
              harness = replace_once(harness, old_actions, new_actions, 'frontend physical actions')
          harness_path.write_text(harness)

          matrix_path = Path('build/scripts/run-packaged-feature-matrix.mjs')
          matrix = matrix_path.read_text()
          helper_marker = 'const F = {'
          helpers = r'''function walkVaultFiles(root, relative = '') {
  const directory = join(root, relative)
  const entries = []
  for (const name of readdirSync(directory, { withFileTypes: true })) {
    const relativePath = relative ? join(relative, name.name) : name.name
    if (name.isDirectory()) entries.push(...walkVaultFiles(root, relativePath))
    else entries.push({
      relativePath,
      absolutePath: join(root, relativePath),
      bytes: statSync(join(root, relativePath)).size
    })
  }
  return entries
}

const escapeCssAttribute = (value) => String(value).replaceAll('\\', '\\\\').replaceAll('"', '\\"')

'''
          if 'function walkVaultFiles' not in matrix:
              matrix = replace_once(matrix, helper_marker, helpers + helper_marker, 'vault walk helper')

          start_token = "  'excalidraw-open-close': async (h) => {"
          end_token = "  'text-basic-editing': async (h) => {"
          start = matrix.find(start_token)
          end = matrix.find(end_token, start)
          if start < 0 or end < 0:
              raise SystemExit('Excalidraw feature block boundaries not found')
          excalidraw_block = r'''  'excalidraw-open-close': async (h) => {
    await prepareVault(h)
    const before = new Set(walkVaultFiles(h.vaultRoot).map((entry) => entry.relativePath))
    await act(h, 'click', '.en-create-excalidraw-button')
    const opened = await dom(h, '[data-testid="excalidraw-dialog"]', (value) => value.visible, 'visible Excalidraw open')
    const canvas = await dom(h, '.en-excalidraw-canvas canvas', (value) => value.visible, 'Excalidraw canvas')
    ok(!opened.text.includes('failed') && canvas.visible, 'Excalidraw opened with an error')
    await act(h, 'fill', '[data-testid="excalidraw-name"]', 'Acceptance drawing')
    await act(h, 'pointerDrag', '.en-excalidraw-canvas canvas', [
      { x: 0.24, y: 0.34 },
      { x: 0.40, y: 0.58 },
      { x: 0.57, y: 0.43 },
      { x: 0.74, y: 0.62 }
    ])
    await act(h, 'click', '.en-excalidraw-button.primary')
    await absent(h, '[data-testid="excalidraw-dialog"]', 'visible Excalidraw save close')

    let added = []
    for (let attempt = 0; attempt < 200; attempt += 1) {
      added = walkVaultFiles(h.vaultRoot).filter((entry) => !before.has(entry.relativePath))
      if (added.some((entry) => /[.]png$/i.test(entry.relativePath)) && added.some((entry) => !/[.]png$/i.test(entry.relativePath))) break
      await z(50)
    }
    const preview = added.find((entry) => /[.]excalidraw[.]png$/i.test(entry.relativePath)) || added.find((entry) => /[.]png$/i.test(entry.relativePath))
    let scene = null
    let sceneFile = null
    for (const entry of added.filter((candidate) => !/[.]png$/i.test(candidate.relativePath))) {
      try {
        const parsed = JSON.parse(readFileSync(entry.absolutePath, 'utf8'))
        if (Array.isArray(parsed?.elements)) {
          scene = parsed
          sceneFile = entry
          break
        }
      } catch {}
    }
    ok(preview?.bytes > 0, `Excalidraw PNG preview missing or empty: ${JSON.stringify(added)}`)
    ok(sceneFile?.bytes > 0 && scene?.elements?.length > 0, `Excalidraw scene missing drawn elements: ${JSON.stringify(added)}`)

    const cardSelector = `[data-entry-path="${escapeCssAttribute(preview.relativePath)}"]`
    await act(h, 'waitFor', cardSelector, 20_000)
    await act(h, 'click', cardSelector)
    const reopened = await dom(h, '[data-testid="excalidraw-dialog"]', (value) => value.visible, 'saved Excalidraw reopen')
    const reopenedCanvas = await dom(h, '.en-excalidraw-canvas canvas', (value) => value.visible, 'reopened Excalidraw canvas')
    ok(!reopened.text.includes('failed') && reopenedCanvas.visible, 'saved Excalidraw could not be reopened')
    await act(h, 'click', '[data-testid="excalidraw-close"]')
    await absent(h, '[data-testid="excalidraw-dialog"]', 'visible Excalidraw close')
    return {
      opened: true,
      drawnElements: scene.elements.length,
      preview: preview.relativePath,
      scene: sceneFile.relativePath,
      reopened: true,
      closed: true
    }
  },
'''
          matrix = matrix[:start] + excalidraw_block + matrix[end:]

          shortcut_count = matrix.count("await set(h, 'pressShortcut'")
          if shortcut_count not in (0, 2):
              raise SystemExit(f'pressShortcut: expected two setup calls, found {shortcut_count}')
          matrix = matrix.replace("await set(h, 'pressShortcut'", "await act(h, 'pressShortcut'")
          drop_count = matrix.count("await set(h, 'dropFiles'")
          if drop_count not in (0, 5):
              raise SystemExit(f'dropFiles: expected five setup calls, found {drop_count}')
          matrix = matrix.replace("await set(h, 'dropFiles'", "await act(h, 'dropFiles'")
          matrix_path.write_text(matrix)
          PY

          rm .github/workflows/agent-expand-bazzite-matrix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Elephant/frontend/src/renderer/src/platform/automationAcceptancePhysicalSurface.js \
            build/scripts/lib/real-app-harness.mjs \
            build/scripts/run-packaged-feature-matrix.mjs \
            .github/workflows/agent-expand-bazzite-matrix.yml
          git commit -m 'test: prove physical Excalidraw and drop actions'
          git push origin HEAD:agent/addon-runtime-stabilization
