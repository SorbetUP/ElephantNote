name: Apply physical Bazzite matrix hardening

on:
  push:
    branches: [agent/addon-runtime-stabilization]
    paths:
      - .github/workflows/agent-expand-bazzite-matrix.yml
      - build/scripts/agent_apply_physical_matrix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/addon-runtime-stabilization
          fetch-depth: 0
      - name: Apply patch
        run: python build/scripts/agent_apply_physical_matrix.py
      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-expand-bazzite-matrix.yml
          rm build/scripts/agent_apply_physical_matrix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: prove physical Excalidraw and drop actions'
          git push origin HEAD:agent/addon-runtime-stabilization
