name: Apply PNG requirement matcher repair

on:
  push:
    branches: [agent/addon-runtime-stabilization]
    paths:
      - .github/workflows/agent-fix-png-requirement-matcher.yml
      - build/scripts/agent_fix_png_requirement_matcher.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/addon-runtime-stabilization
          fetch-depth: 0
      - run: python build/scripts/agent_fix_png_requirement_matcher.py
      - name: Commit repaired matcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-fix-png-requirement-matcher.yml
          rm build/scripts/agent_fix_png_requirement_matcher.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: repair durable PNG proof matcher'
          git push origin HEAD:agent/addon-runtime-stabilization
