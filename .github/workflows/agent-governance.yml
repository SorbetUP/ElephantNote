name: Apply final five guarded fixes

on:
  push:
    branches:
      - agent/fix-remaining-packaged-matrix
    paths:
      - build/scripts/apply_pasted_patch.py
      - .github/workflows/agent-governance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-five-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 3

      - name: Apply guarded product corrections
        run: python build/scripts/apply_pasted_patch.py

      - name: Validate patched contracts
        shell: bash
        run: |
          set -euxo pipefail
          node --check Elephant/frontend/src/renderer/src/muya/realMuyaRustAdapter.js
          python - <<'PY'
          from pathlib import Path
          adapter = Path('Elephant/frontend/src/renderer/src/muya/realMuyaRustAdapter.js').read_text()
          editor = Path('Elephant/frontend/src/renderer/src/components/editorWithTabs/runtimeEditor.vue').read_text()
          excalidraw = Path('Elephant/frontend/app/components/editor/ExcalidrawDialog.vue').read_text()
          assert 'this.options.onFileDrop(files, event)' in adapter
          assert "drop:delegated" in adapter
          assert ':on-file-drop="handleFileDrop"' in editor
          assert 'product handler entered' in editor
          assert 'const apiRef = shallowRef(null)' in excalidraw
          assert 'const root = shallowRef(null)' in excalidraw
          assert 'data-testid="excalidraw-name"' in excalidraw
          PY
          git diff --check

      - name: Commit only product fixes
        shell: bash
        run: |
          set -euxo pipefail
          git checkout HEAD^ -- .github/workflows/agent-governance.yml
          git checkout HEAD^^ -- build/scripts/apply_pasted_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-governance.yml build/scripts/apply_pasted_patch.py \
            Elephant/frontend/src/renderer/src/muya/realMuyaRustAdapter.js \
            Elephant/frontend/src/renderer/src/components/editorWithTabs/runtimeEditor.vue \
            Elephant/frontend/app/components/editor/ExcalidrawDialog.vue
          git commit -m "fix: route file drops and isolate Excalidraw React state"
          git push origin HEAD:${{ github.ref_name }}
