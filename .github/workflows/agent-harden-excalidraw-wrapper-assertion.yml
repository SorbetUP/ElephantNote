name: Apply Excalidraw wrapper assertion hardening

on:
  push:
    branches: [agent/fix-remaining-packaged-matrix]
    paths:
      - .github/workflows/agent-harden-excalidraw-wrapper-assertion.yml
      - build/scripts/agent_harden_excalidraw_wrapper_assertion.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-remaining-packaged-matrix
          fetch-depth: 0
      - run: python build/scripts/agent_harden_excalidraw_wrapper_assertion.py
      - name: Validate runner syntax
        run: node --check build/scripts/run-packaged-feature-matrix.mjs
      - name: Commit assertion and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-harden-excalidraw-wrapper-assertion.yml
          rm build/scripts/agent_harden_excalidraw_wrapper_assertion.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: reject invalid root Excalidraw preview links'
          git push origin HEAD:agent/fix-remaining-packaged-matrix
