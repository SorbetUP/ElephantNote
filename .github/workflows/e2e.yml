name: E2E Test

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Linux three-layer distributed AppImage proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      FORCE_COLOR: '1'
      ELEPHANT_E2E_EXHAUSTIVE_EVIDENCE: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/setup-tauri-cli

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb xdotool libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64 unzip \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            patchelf

      - uses: ./.github/actions/setup

      - name: Reject fake or inflated tests
        shell: bash
        run: |
          set -euxo pipefail
          pnpm test:trust:guard 2>&1 | tee test-trust.txt

      - name: Validate three proof layers and addon matrix wiring
        shell: bash
        run: |
          set -euxo pipefail
          node build/scripts/run-observable.mjs --label proof-layer-wiring -- \
            pnpm test:feature-matrix 2>&1 | tee proof-layer-wiring.txt

      - name: Verify exact prebuilt wasm-bindgen CLI
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=$(cargo metadata --manifest-path Elephant/crates/muya-wasm/Cargo.toml --format-version 1 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='wasm-bindgen'))")
          wasm-bindgen --version | grep -F "${VERSION}"

      - name: Run postinstall with complete output
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'
        run: |
          set -euxo pipefail
          node build/scripts/run-observable.mjs --label postinstall -- \
            node build/scripts/postinstall.js

      - name: Build and select the exact distributed Linux AppImage
        shell: bash
        run: |
          set -euxo pipefail
          node build/scripts/run-observable.mjs --label tauri-linux-build -- \
            pnpm build:linux 2>&1 | tee tauri-linux-build.txt
          APPIMAGE_GLOB='Elephant/backend/tauri/target/release/bundle/appimage/*.AppImage'
          compgen -G "$APPIMAGE_GLOB" >/dev/null
          APPIMAGE_PATH="$(compgen -G "$APPIMAGE_GLOB" | head -n 1)"
          test -n "$APPIMAGE_PATH"
          test -f "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          APPIMAGE_PATH="$(realpath "$APPIMAGE_PATH")"
          printf 'ELEPHANT_PACKAGED_APP=%s\n' "$APPIMAGE_PATH" >> "$GITHUB_ENV"
          printf 'ELEPHANT_PACKAGED_FORMAT=linux-appimage\n' >> "$GITHUB_ENV"
          printf 'APPIMAGE_EXTRACT_AND_RUN=1\n' >> "$GITHUB_ENV"
          sha256sum "$APPIMAGE_PATH" | tee packaged-appimage.sha256
          ls -lh "$APPIMAGE_PATH"

      - name: Prove backend, frontend and user tests turn red under regressions
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            pnpm test:layers:sensitivity 2>&1 | tee three-layer-sensitivity.txt
          grep -F '[three-layer-sensitivity] PASS: backend, frontend and packaged user proof all detect deliberate regressions' \
            three-layer-sensitivity.txt

      - name: Run backend production contract layer
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            pnpm test:backend:raw 2>&1 | tee backend-contract.txt

      - name: Prove the Markdown suite turns red under deliberate mutations
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            node build/scripts/verify-markdown-trust-sensitivity.mjs \
            2>&1 | tee markdown-trust-sensitivity.txt
          grep -F '[markdown-trust-sensitivity] PASS: all deliberate mutations made the real suite red' \
            markdown-trust-sensitivity.txt

      - name: Run frontend behavior layer through visible controls
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            pnpm test:frontend:raw 2>&1 | tee frontend-behavior.txt

      - name: Run exact distributed AppImage user journey layer
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            pnpm test:user:packaged:raw 2>&1 | tee packaged-user-journey.txt

      - name: Verify three-layer runtime evidence
        shell: bash
        run: |
          set -euxo pipefail
          node - <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('tests/trust/test-layers.json', 'utf8'))
          for (const category of manifest.categories) {
            if (!fs.existsSync(category.artifact)) throw new Error(`${category.id} did not produce ${category.artifact}`)
            const evidence = JSON.parse(fs.readFileSync(category.artifact, 'utf8'))
            if (evidence.status !== 'PROVEN') throw new Error(`${category.id} is not proven: ${JSON.stringify(evidence)}`)
            const scenarios = Array.isArray(evidence.scenarios) ? evidence.scenarios : []
            const missing = category.requiredScenarios.filter((id) => !scenarios.some((scenario) => scenario.id === id && scenario.ok === true))
            if (missing.length) throw new Error(`${category.id} is missing passing scenarios: ${JSON.stringify(missing)}`)
            const failed = scenarios.filter((scenario) => scenario.ok !== true)
            if (failed.length) throw new Error(`${category.id} contains failing scenarios: ${JSON.stringify(failed)}`)
            if ((category.id === 'frontend-behavior' || category.id === 'packaged-user-journey')) {
              const forbidden = new Set(category.forbiddenProofCommands || [])
              const violations = (evidence.commandPolicy?.actionCommands || []).filter((entry) => forbidden.has(entry.command))
              if (violations.length) throw new Error(`${category.id} bypassed the frontend with internal commands: ${JSON.stringify(violations)}`)
            }
            if (evidence.packagedApp !== true) {
              throw new Error(`${category.id} did not run the distributed AppImage`)
            }
            if (evidence.packagedFormat !== 'linux-appimage') {
              throw new Error(`${category.id} ran the wrong package format: ${JSON.stringify(evidence.packagedFormat)}`)
            }
            if (category.requiredPackagedFormat && evidence.packagedFormat !== category.requiredPackagedFormat) {
              throw new Error(`${category.id} package format mismatch: ${JSON.stringify({ expected: category.requiredPackagedFormat, actual: evidence.packagedFormat })}`)
            }
            if (evidence.appPath !== process.env.ELEPHANT_PACKAGED_APP) {
              throw new Error(`${category.id} ran a different executable: ${JSON.stringify({ expected: process.env.ELEPHANT_PACKAGED_APP, actual: evidence.appPath })}`)
            }
          }
          console.log('[three-layer-proof] PROVEN backend + frontend + distributed AppImage user journey')
          NODE

          for proof_glob in \
            'test-results/trusted/backend-contract/**' \
            'test-results/trusted/frontend-behavior/**' \
            'test-results/trusted/packaged-user-journey/**'
          do
            compgen -G "$proof_glob" >/dev/null || {
              echo "Missing mandatory local proof files: $proof_glob" >&2
              exit 1
            }
          done

      - name: Run exhaustive official addon suite through the external app API
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            ELEPHANT_ACCEPTANCE_APP_PATH="$ELEPHANT_PACKAGED_APP" \
            pnpm test:automation:raw 2>&1 | tee automation-tests.txt

      - name: Verify exhaustive automation evidence and renderer logs
        shell: bash
        run: |
          set -euxo pipefail
          test -s test-results/acceptance/latest.json
          node - <<'NODE'
          const fs = require('fs')
          const payload = JSON.parse(fs.readFileSync('test-results/acceptance/latest.json', 'utf8'))
          if (!payload?.result) throw new Error(`Automation suite did not report a result: ${JSON.stringify(payload)}`)
          const logs = Array.isArray(payload.result.logs) ? payload.result.logs : []
          const unexpected = logs.filter((entry) => String(entry.level || '').toLowerCase() === 'error')
          if (unexpected.length) throw new Error(`Automation logs contain ${unexpected.length} unexpected application error(s): ${JSON.stringify(unexpected.slice(0, 10))}`)
          NODE

      - name: Collect explicit official addon evidence
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p official-addon-evidence
          while IFS= read -r evidence
          do
            cp "$evidence" "official-addon-evidence/$(basename "$evidence")"
          done < <(find test-results -type f -name '*native-package-evidence.json' -print 2>/dev/null || true)
          find official-addon-evidence -maxdepth 1 -type f -print -exec cat {} \; || true

      - name: Write explicit structured three-layer proof status
        if: always()
        shell: bash
        env:
          ELEPHANT_PROOF_EVIDENCE_ROOT: .
          ELEPHANT_PROOF_STATUS_PATH: test-results/trusted/summary/latest.json
          ELEPHANT_UPSTREAM_CONCLUSION: ${{ job.status }}
          ELEPHANT_PROOF_HEAD_SHA: ${{ github.sha }}
          ELEPHANT_PROOF_STATUS_FAIL_CLOSED: '1'
        run: |
          set -o pipefail
          node build/scripts/write-three-layer-proof-status.mjs 2>&1 | tee three-layer-proof-status.txt

      - name: Upload compact Linux proof diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-three-layer-distributed-appimage-proof-and-addon-diagnostics
          path: |
            test-trust.txt
            proof-layer-wiring.txt
            three-layer-sensitivity.txt
            three-layer-proof-status.txt
            backend-contract.txt
            markdown-trust-sensitivity.txt
            frontend-behavior.txt
            packaged-user-journey.txt
            official-addon-native-build.txt
            tauri-linux-build.txt
            packaged-appimage.sha256
            automation-tests.txt
            test-results/trust/**/*.json
            test-results/trusted/**/*.json
            test-results/trusted/**/*.log
            test-results/trusted/**/*.txt
            test-results/observability/**/*.json
            test-results/observability/**/*.log
            test-results/observability/**/*.txt
            test-results/acceptance/**/*.json
            test-results/acceptance/**/*.log
            test-results/acceptance/**/*.txt
            official-addon-evidence/**/*.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

  concise-diagnostics:
    name: Concise three-layer failure diagnostics
    needs: e2e
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Download proof diagnostics
        uses: actions/download-artifact@v8
        with:
          name: linux-three-layer-distributed-appimage-proof-and-addon-diagnostics
          path: diagnostics

      - name: Print concise proof status and failure
        shell: bash
        run: |
          set -u
          node - <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = 'diagnostics'
          const summaryFile = path.join(root, 'test-results/trusted/summary/latest.json')
          if (fs.existsSync(summaryFile)) {
            const summary = JSON.parse(fs.readFileSync(summaryFile, 'utf8'))
            console.log(`[concise-proof] overall: ${summary.status}; upstream=${summary.upstreamConclusion}; sha=${summary.headSha || 'unknown'}`)
            for (const category of summary.categories || []) {
              console.log(`[concise-proof] ${category.id}: availability=${category.availability}; status=${category.status}; reason=${category.reason || 'none'}; failed=${JSON.stringify(category.failedScenarioIds || [])}`)
            }
          } else {
            console.log('[concise-proof] structured summary: MISSING')
          }
          const candidates = [
            ['backend-contract', 'test-results/trusted/backend-contract/latest.json'],
            ['frontend-behavior', 'test-results/trusted/frontend-behavior/latest.json'],
            ['packaged-user-journey', 'test-results/trusted/packaged-user-journey/latest.json'],
            ['markdown-editor', 'test-results/trusted/markdown-editor/latest.json']
          ]
          for (const [label, relative] of candidates) {
            const file = path.join(root, relative)
            if (!fs.existsSync(file)) {
              console.log(`[concise-proof] ${label}: MISSING`)
              continue
            }
            const evidence = JSON.parse(fs.readFileSync(file, 'utf8'))
            const failed = (evidence.scenarios || []).filter((scenario) => scenario.ok !== true)
            console.log(`[concise-proof] ${label}: ${evidence.status}; error=${evidence.error?.message || evidence.error || 'none'}; failed=${JSON.stringify(failed)}`)
          }
          NODE
          echo '--- frontend-behavior tail ---'
          tail -n 160 diagnostics/frontend-behavior.txt 2>/dev/null || true
          echo '--- mutation-sensitivity tail ---'
          tail -n 80 diagnostics/three-layer-sensitivity.txt 2>/dev/null || true
