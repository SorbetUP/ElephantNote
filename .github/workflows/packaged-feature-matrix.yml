name: Packaged independent feature matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/packaged-feature-matrix.yml'
      - 'build/scripts/run-packaged-feature-matrix.mjs'
      - 'build/scripts/verify-packaged-feature-matrix.mjs'
      - 'build/scripts/lib/real-app-harness.mjs'
      - 'tests/trust/packaged-feature-matrix.json'
      - 'Elephant/frontend/src/renderer/src/platform/automationAcceptancePhysicalSurface.js'
      - 'Elephant/frontend/src/renderer/src/Main.vue'
      - 'Elephant/frontend/src/**'
      - 'Elephant/frontend/app/**'
      - 'Elephant/backend/tauri/src/**'
  workflow_dispatch:

concurrency:
  group: packaged-feature-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Independent feature contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: node build/scripts/verify-packaged-feature-matrix.mjs

  exact-appimage:
    name: Twenty isolated features on exact AppImage
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      FORCE_COLOR: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/setup-tauri-cli
      - name: Install Linux runtime dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libgtk-3-0 libgbm1 libasound2t64 unzip \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            patchelf xdg-utils
      - uses: ./.github/actions/setup
      - name: Install workspace dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'
        run: node build/scripts/postinstall.js
      - name: Build exact AppImage
        shell: bash
        run: |
          set -euxo pipefail
          pnpm build:linux 2>&1 | tee packaged-feature-build.log
          APPIMAGE_PATH="$(find Elephant/backend/tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -f "$APPIMAGE_PATH"
          chmod +x "$APPIMAGE_PATH"
          APPIMAGE_PATH="$(realpath "$APPIMAGE_PATH")"
          echo "ELEPHANT_ACCEPTANCE_APP_PATH=$APPIMAGE_PATH" >> "$GITHUB_ENV"
          echo "ELEPHANT_PACKAGED_APP=$APPIMAGE_PATH" >> "$GITHUB_ENV"
          echo 'ELEPHANT_PACKAGED_FORMAT=linux-appimage' >> "$GITHUB_ENV"
          echo 'APPIMAGE_EXTRACT_AND_RUN=1' >> "$GITHUB_ENV"
          sha256sum "$APPIMAGE_PATH" | tee packaged-feature-appimage.sha256
      - name: Run all independent feature tests
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum env \
            ELEPHANT_ACCEPTANCE_SKIP_BUILD=1 \
            node build/scripts/run-packaged-feature-matrix.mjs \
            2>&1 | tee packaged-feature-matrix.log
      - name: Upload every independent verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: exact-appimage-independent-feature-matrix
          path: |
            packaged-feature-build.log
            packaged-feature-appimage.sha256
            packaged-feature-matrix.log
            test-results/trusted/packaged-feature-matrix/latest.json
            test-results/trusted/packaged-feature-*/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
