name: Build/release Elephant

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows
            os: windows-latest
            platform: windows
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            target: x86_64-apple-darwin
          - name: macos-arm64
            os: macos-15
            platform: macos
            target: aarch64-apple-darwin

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: 'pnpm'

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      # --ignore-scripts so we can set env vars before postinstall runs
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Must be set before postinstall runs
      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> "$GITHUB_ENV"

      # Run the full postinstall and locale minification.
      - name: Run postinstall
        run: node build/scripts/postinstall.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: Validate release version and addon compatibility
        run: pnpm release:check
        env:
          ELEPHANT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: build-linux
        if: matrix.platform == 'linux'
        run: pnpm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS artifacts remain pre-release until Developer ID signing and notarization are configured.
      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm run build:mac -- --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD_TARGET: ${{ matrix.target }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          name: 'Elephant pre-release ${{ github.ref_name }}'
          body: |
            ## Elephant pre-release
            This artifact set was built from the exact tag ${{ github.ref_name }}.

            ## macOS packaging
            macOS artifacts are unsigned until the repository has a configured Developer ID and notarization workflow. Keep this release pre-release until that proof is available.

            ## Changes
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
