name: Tauri desktop acceptance

on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-acceptance:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            platform: linux
          - name: windows-x86_64
            os: windows-latest
            platform: windows
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos
          - name: macos-aarch64
            os: macos-15
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev \
            libgtk-3-0 libgbm1 libnss3 libasound2t64 patchelf unzip xvfb xdotool

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install pinned Tauri CLI
        shell: bash
        run: |
          set -euxo pipefail
          if ! cargo tauri --version 2>/dev/null | grep -Fq '2.11.2'; then
            cargo install tauri-cli --version 2.11.2 --locked
          fi
          cargo tauri --version

      - uses: ./.github/actions/setup

      - name: Install exact wasm-bindgen CLI
        shell: bash
        run: |
          set -euxo pipefail
          VERSION=$(cargo metadata --manifest-path Elephant/crates/muya-wasm/Cargo.toml --format-version 1 \
            | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='wasm-bindgen'))")
          if ! wasm-bindgen --version 2>/dev/null | grep -q "${VERSION}$"; then
            cargo install wasm-bindgen-cli --version "$VERSION" --locked
          fi
          wasm-bindgen --version

      - name: Validate platform contracts
        shell: bash
        run: pnpm tauri:platform:check

      - name: Build packaged Tauri desktop application
        shell: bash
        run: |
          set -euxo pipefail
          case "${{ matrix.platform }}" in
            linux) pnpm build:linux 2>&1 | tee tauri-build.txt ;;
            macos) pnpm build:mac 2>&1 | tee tauri-build.txt ;;
            windows) pnpm build:win 2>&1 | tee tauri-build.txt ;;
          esac

      - name: Run packaged Tauri acceptance scenario
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run --auto-servernum pnpm test:desktop:acceptance:packaged 2>&1 | tee tauri-acceptance.txt
          else
            pnpm test:desktop:acceptance:packaged 2>&1 | tee tauri-acceptance.txt
          fi

      - name: Prove exact Linux AppImage editor durability
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          APPIMAGE="$(find Elephant/backend/tauri/target/release/bundle dist -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -f "$APPIMAGE"
          chmod +x "$APPIMAGE"
          sha256sum "$APPIMAGE" | tee appimage-sha256.txt
          APPIMAGE_EXTRACT_AND_RUN=1 \
          ELEPHANT_ACCEPTANCE_APP_PATH="$APPIMAGE" \
          ELEPHANT_PACKAGED_FORMAT=linux-appimage \
            xvfb-run --auto-servernum pnpm test:user:packaged:raw 2>&1 | tee appimage-editor-durability.txt

      - name: Upload compact Tauri acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-acceptance-${{ matrix.name }}
          path: |
            tauri-build.txt
            tauri-acceptance.txt
            appimage-sha256.txt
            appimage-editor-durability.txt
            test-results/acceptance/**/*.json
            test-results/acceptance/**/*.log
            test-results/acceptance/**/*.txt
            test-results/trusted/**/*.json
            test-results/trusted/**/*.log
            test-results/trusted/**/*.txt
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
