name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run Unit Tests
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee vitest-output.txt

      - name: Upload Vitest failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: vitest-output.txt
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
