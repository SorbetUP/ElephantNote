name: Test trust policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - 'agent/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trust-policy:
    name: Reject fake or inflated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate
          pnpm --version

      - name: Prove trust diagnostics are dependency-free
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e Elephant/node_modules
          test ! -e node_modules
          node build/scripts/verify-test-trust-mandatory-scenarios.mjs 2>&1 | tee test-trust-mandatory-scenarios.txt
          node build/scripts/verify-three-layer-proof-status.mjs 2>&1 | tee three-layer-proof-status-self-test.txt

      - name: Prove the trust guard rejects invalid fixtures
        shell: bash
        run: |
          set -o pipefail
          node build/scripts/verify-test-trust-negative-cases.mjs 2>&1 | tee test-trust-negative-cases.txt

      - name: Verify test trust policy
        shell: bash
        run: |
          set -o pipefail
          pnpm test:trust:guard 2>&1 | tee test-trust.txt

      - name: Upload trust-policy failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-trust-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-trust-mandatory-scenarios.txt
            three-layer-proof-status-self-test.txt
            test-trust-negative-cases.txt
            test-trust.txt
            test-results/trust/**
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
