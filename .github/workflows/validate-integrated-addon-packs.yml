name: Validate integrated addon packs

on:
  push:
    branches:
      - develop_next-unified-candidate2
      - develop_next-unified-recovery
      - develop_next-mobile-recovery
    paths:
      - .github/workflows/validate-integrated-addon-packs.yml
      - build/scripts/sync-elephant-addons.mjs
      - build/scripts/validate-integrated-addon-packs.mjs
  pull_request:
    paths:
      - .github/workflows/validate-integrated-addon-packs.yml
      - build/scripts/sync-elephant-addons.mjs
      - build/scripts/validate-integrated-addon-packs.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-integrated-addon-packs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Materialize pinned addon catalogue and packs
        env:
          ELEPHANT_SKIP_NATIVE_ADDON_BUILD: '1'
        run: node build/scripts/sync-elephant-addons.mjs

      - name: Validate pack, catalogue, manifest and dependency consistency
        run: node build/scripts/validate-integrated-addon-packs.mjs
